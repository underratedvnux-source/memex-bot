<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoinCheck – Analyse de memecoin Solana</title>
<style>
:root{--bg:#0b0b10;--sf:#15151d;--tx:#f1f0f5;--mu:#9a99a6;--bd:#262633;--ok:#14c38e;--wa:#f5a524;--dg:#ff3b5c;--ac:#7b5cff;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#1d1a3a,transparent),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.w{max-width:860px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:32px;margin:0;letter-spacing:-.5px}h1 span{background:linear-gradient(90deg,var(--ok),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:6px 0 22px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:220px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:14px;font:inherit}
input:focus{outline:2px solid var(--ac)}
button{border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ok),var(--ac));cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.st{color:var(--mu);margin:18px 0}
.v{border:1px solid var(--bd);border-radius:16px;padding:20px;margin:22px 0;background:var(--sf)}
.v .sc{font-size:40px;font-weight:800;line-height:1.1}
.v .tt{font-size:20px;font-weight:700;margin-top:6px}
.meter{height:8px;border-radius:4px;background:var(--bd);margin-top:14px;overflow:hidden}.meter i{display:block;height:100%}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:26px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.c b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.f{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.f:last-child{border:0}
.d{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.note{font-size:13px;color:var(--mu);margin-top:22px;border-left:3px solid var(--ac);padding-left:12px}
a{color:var(--ok)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
</style>
</head>
<body>
<div class="w">
  <h1>Coin<span>Check</span></h1>
  <p class="sub">Colle l’adresse d’un token Solana : infos, signaux de risque et verdict en quelques secondes.</p>
  <div class="bar">
    <input id="addr" placeholder="Adresse du token (mint) ou lien pump.fun / DexScreener" spellcheck="false" autocomplete="off">
    <button id="go">Analyser</button>
  </div>
  <div id="out"></div>
</div>
<script>
const DS = "https://api.dexscreener.com";
const RC = "https://api.rugcheck.xyz/v1/tokens/";
const B58 = /[1-9A-HJ-NP-Za-km-z]{32,44}/;
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const usd = (n) => {
  if (n == null || isNaN(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + Number(n).toPrecision(3);
};
const pct = (n) => (n == null ? "—" : (n > 0 ? "+" : "") + n + "%");
const age = (ms) => {
  if (!ms) return "—";
  const h = (Date.now() - ms) / 36e5;
  return h < 1 ? Math.round(h * 60) + " min" : h < 48 ? h.toFixed(1) + " h" : Math.round(h / 24) + " j";
};
const COL = { ok: "var(--ok)", warn: "var(--wa)", bad: "var(--dg)", info: "var(--mu)" };

async function run(input) {
  const out = $("out");
  const m = input.match(B58);
  if (!m) { out.replaceChildren(el("div", "st", "Adresse invalide : colle l’adresse complète du token.")); return; }
  out.replaceChildren(el("div", "st", "Analyse en cours…"));
  $("go").disabled = true;
  try {
    let addr = m[0];
    let pairs = [];
    try {
      const d = await getJSON(DS + "/latest/dex/tokens/" + addr);
      pairs = (d.pairs || []).filter((p) => p.chainId === "solana");
    } catch (e) {}
    if (!pairs.length) {
      try {
        const d = await getJSON(DS + "/latest/dex/pairs/solana/" + addr);
        const p0 = (d.pairs || [])[0];
        if (p0) { pairs = [p0]; addr = p0.baseToken.address; }
      } catch (e) {}
    }
    pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
    const p = pairs[0];

    const rug = await getJSON(RC + addr + "/report").catch(() => null);

    const authority = (key) => {
      if (!rug) return undefined;
      return rug[key] !== undefined ? rug[key] : rug.token?.[key];
    };
    const ma = authority("mintAuthority"), fa = authority("freezeAuthority");
    const holders = rug?.topHolders || [];
    const top1 = holders.length ? Number(holders[0].pct) : null;
    const top10 = holders.length ? holders.slice(0, 10).reduce((a, h) => a + Number(h.pct || 0), 0) : null;
    const insiders = holders.filter((h) => h.insider).length;

    const flags = [];
    const add = (pts, level, text) => flags.push({ pts, level, text });

    if (!p) add(40, "bad", "Aucune paire de trading trouvée : impossible de l’acheter ou de le vendre normalement.");
    if (rug?.rugged) add(60, "bad", "RugCheck marque ce token comme « rugged » (déjà rug pull).");

    if (ma === undefined) add(5, "info", "Mint authority : information indisponible.");
    else if (ma) add(25, "bad", "Le créateur peut encore imprimer de nouveaux tokens (mint authority active).");
    else add(0, "ok", "Mint authority révoquée : pas de nouveaux tokens possibles.");
    if (fa === undefined) add(3, "info", "Freeze authority : information indisponible.");
    else if (fa) add(15, "bad", "Le créateur peut geler les wallets (freeze authority active).");
    else add(0, "ok", "Freeze authority révoquée.");

    if (p) {
      const liq = p.liquidity?.usd || 0;
      if (liq < 5000) add(25, "bad", "Liquidité très faible (" + usd(liq) + ") : sortie difficile, prix très volatil.");
      else if (liq < 20000) add(12, "warn", "Liquidité faible (" + usd(liq) + ").");
      else add(0, "ok", "Liquidité correcte (" + usd(liq) + ").");

      const h = p.pairCreatedAt ? (Date.now() - p.pairCreatedAt) / 36e5 : null;
      if (h != null && h < 1) add(15, "bad", "Token créé il y a moins d’une heure.");
      else if (h != null && h < 24) add(8, "warn", "Token créé il y a moins de 24 h.");

      const b = p.txns?.h24?.buys || 0, s = p.txns?.h24?.sells || 0;
      if (s > b * 1.5 && s > 30) add(8, "warn", "Beaucoup plus de ventes que d’achats sur 24 h (" + s + " vs " + b + ").");
      if ((p.priceChange?.h24 ?? 0) < -50) add(10, "warn", "Chute de plus de 50 % sur 24 h.");
    }
    if (top10 != null) {
      if (top10 > 50) add(25, "bad", "Les 10 plus gros comptes détiennent " + top10.toFixed(0) + " % (peut inclure la liquidité).");
      else if (top10 > 30) add(12, "warn", "Concentration élevée : top 10 = " + top10.toFixed(0) + " %.");
      else add(0, "ok", "Répartition correcte : top 10 = " + top10.toFixed(0) + " %.");
    }
    if (insiders >= 3) add(15, "bad", insiders + " des plus gros comptes sont liés à des wallets d’initiés.");
    else if (insiders > 0) add(6, "warn", insiders + " compte(s) de gros holders lié(s) à des initiés.");

    if (rug?.risks?.length) {
      rug.risks.filter((r) => r.level === "danger").slice(0, 3).forEach((r) => add(12, "bad", "RugCheck : " + r.name));
      rug.risks.filter((r) => r.level === "warn").slice(0, 3).forEach((r) => add(3, "warn", "RugCheck : " + r.name));
    }
    if (!rug) add(5, "info", "Rapport RugCheck indisponible : l’analyse est moins complète.");

    const score = Math.max(0, Math.min(100, flags.reduce((a, f) => a + f.pts, 0)));
    let col = "ok", title = "Pas de signal rouge majeur", sub = "Ça ne veut pas dire que c’est sûr : un memecoin reste très risqué.";
    if (score >= 75) { col = "bad"; title = "Danger : à éviter"; sub = "Plusieurs signaux typiques d’un rug pull ou d’un token piégé."; }
    else if (score >= 50) { col = "bad"; title = "Risque élevé : plutôt à éviter"; sub = "Trop de signaux négatifs pour y mettre de l’argent."; }
    else if (score >= 25) { col = "warn"; title = "Prudence"; sub = "Des points d’attention : vérifie-les avant d’acheter."; }

    out.replaceChildren();
    const v = el("div", "v");
    v.style.borderColor = COL[col];
    const sc = el("div", "sc", score + " / 100 de risque"); sc.style.color = COL[col];
    v.append(sc, el("div", "tt", title), el("div", "st", sub));
    const mt = el("div", "meter"), fill = document.createElement("i");
    fill.style.width = score + "%"; fill.style.background = COL[col]; mt.append(fill); v.append(mt);
    out.append(v);

    const name = p?.baseToken?.name || rug?.tokenMeta?.name || "Token";
    const sym = p?.baseToken?.symbol || rug?.tokenMeta?.symbol || "?";
    out.append(el("h2", null, name + " ($" + sym + ")"));
    const g = el("div", "g");
    const cells = [
      ["Prix", p?.priceUsd ? usd(Number(p.priceUsd)) : "—"],
      ["Market cap (FDV)", usd(p?.fdv)],
      ["Liquidité", usd(p?.liquidity?.usd)],
      ["Volume 24 h", usd(p?.volume?.h24)],
      ["Variation 1 h", pct(p?.priceChange?.h1)],
      ["Variation 24 h", pct(p?.priceChange?.h24)],
      ["Achats 24 h", p?.txns?.h24?.buys ?? "—"],
      ["Ventes 24 h", p?.txns?.h24?.sells ?? "—"],
      ["Âge", age(p?.pairCreatedAt)],
      ["Marché", p?.dexId || "—"],
      ["Plus gros compte", top1 != null ? top1.toFixed(1) + " %" : "—"],
      ["Top 10 comptes", top10 != null ? top10.toFixed(1) + " %" : "—"],
    ];
    cells.forEach(([k, val]) => { const c = el("div", "c"); c.append(el("b", null, k), el("span", null, String(val))); g.append(c); });
    out.append(g);

    out.append(el("h2", null, "Signaux détectés"));
    const fl = el("div");
    flags.forEach((f) => {
      const r = el("div", "f"); const d = el("span", "d"); d.style.background = COL[f.level];
      r.append(d, el("span", null, f.text)); fl.append(r);
    });
    out.append(fl);

    const links = el("div", "links");
    if (p?.url && p.url.startsWith("https://dexscreener.com/")) {
      const a = el("a", null, "Graphique DexScreener ↗"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; links.append(a);
    }
    const r1 = el("a", null, "Rapport RugCheck ↗"); r1.href = "https://rugcheck.xyz/tokens/" + addr; r1.target = "_blank"; r1.rel = "noopener"; links.append(r1);
    out.append(links);
    out.append(el("div", "note", "Score calculé avec des données publiques (DexScreener et RugCheck). C’est une aide à la décision, pas un conseil financier : un score bas n’est pas une garantie, un score élevé n’est pas une certitude. Le plus gros compte peut être la liquidité du token et non une personne."));
    history.replaceState(null, "", "?mint=" + addr);
  } catch (e) {
    out.replaceChildren(el("div", "st", "Erreur : " + e.message));
  }
  $("go").disabled = false;
}

$("go").addEventListener("click", () => run($("addr").value));
$("addr").addEventListener("keydown", (e) => { if (e.key === "Enter") run($("addr").value); });
const q = new URLSearchParams(location.search).get("mint");
if (q) { $("addr").value = q; run(q); }
</script>
</body>
</html>
