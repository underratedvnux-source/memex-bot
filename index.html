<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PnL Calendar</title>
<meta name="description" content="Calendrier de PnL pour tes trades memecoins, forex, crypto et actions.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --panel:#0a0a0a; --cell:#141414; --cell-h:#1e1e1e; --line:#262626;
  --text:#ededed; --mut:#8c8c8c;
  --gain:#34d399; --loss:#f87171; --gold:#e5b94a; --accent:#ededed;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:var(--f);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"cal day" "tools tools";gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.wrap>section:nth-of-type(1){grid-area:cal}
.wrap>section:nth-of-type(2){grid-area:day;position:sticky;top:12px}
.wrap>section:nth-of-type(3){grid-area:tools;padding:12px 16px}

/* en-tête */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.head .l{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.head h1{font-size:15px;font-weight:600;margin:0}
.pills{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pill{border:0;border-right:1px solid var(--line);background:transparent;color:var(--mut);padding:6px 12px;font-size:13px;font-weight:500}
.pill:last-child{border-right:0}
.pill:hover{color:var(--text);background:var(--cell)}
.pill[aria-pressed="true"]{background:var(--text);color:#000}
.head .r{display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;gap:2px}
.nav h2{font-size:15px;font-weight:600;margin:0;min-width:9ch;text-align:center}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font-size:18px;line-height:1;display:grid;place-items:center}
.ib:hover{background:var(--cell)}
.ib.boxed{border-color:var(--line);font-size:14px}

/* total */
.total{color:var(--mut);font-size:13px;margin-bottom:12px}
.total span{display:block;font-size:clamp(32px,5vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-top:2px}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--cell);gap:2px}
.bar i{display:block;height:100%}
.bar .a{background:var(--gain)} .bar .b{background:var(--loss)}
.bl{display:flex;justify-content:space-between;margin:8px 0 22px;font-size:12px;font-weight:500}
.bl .a{color:var(--gain)} .bl .b{color:var(--loss)}
.gn{color:var(--gain)} .ls{color:var(--loss)}

/* grille : --i (0 à 1) règle l'intensité de la couleur */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:left;font-weight:500;padding:0 2px 8px;font-size:12px;color:var(--mut)}
.cell{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-height:88px;padding:8px 10px;position:relative;display:flex;align-items:flex-end;justify-content:flex-start;font-weight:600;font-size:15px;color:var(--mut)}
.cell:hover{background:var(--cell-h)}
.cell .d{position:absolute;top:7px;left:9px;font-size:12px;font-weight:500;color:var(--mut)}
.cell .c{position:absolute;top:7px;right:9px;font-size:11px;font-weight:500;color:var(--mut)}
.cell.g{background:color-mix(in srgb,var(--gain) calc(5% + var(--i,0)*22%),var(--panel));border-color:color-mix(in srgb,var(--gain) 35%,var(--line));color:var(--gain)}
.cell.l{background:color-mix(in srgb,var(--loss) calc(5% + var(--i,0)*22%),var(--panel));border-color:color-mix(in srgb,var(--loss) 35%,var(--line));color:var(--loss)}
.cell.k{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-color:var(--gold);color:var(--gold)}
.cell.g .d,.cell.l .d,.cell.k .d{color:inherit;opacity:.8}
.cell.g:hover,.cell.l:hover,.cell.k:hover{filter:brightness(1.2)}
.cell.today .d{color:#000;background:var(--text);opacity:1;border-radius:4px;padding:0 5px;top:5px;left:6px}
.cell.sel{box-shadow:0 0 0 2px #fff}
.blank{min-height:88px}
.sub{color:var(--mut);font-size:12px;margin-top:14px}

/* jour */
.day h3{font-size:15px;font-weight:600;margin:0 0 14px;text-transform:capitalize}
.list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t b{font-weight:600}
.list .n{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:600}
.list .none{color:var(--mut);font-size:13px}
.x{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:6px;padding:2px 8px;font-size:12px}
.x:hover{color:var(--loss);border-color:var(--loss)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--mut)}
form .w,form .full{grid-column:1/-1}
form .full{display:flex}
form .full .btn{width:100%}
input,select{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:38px;width:100%;color:var(--text)}
input:focus,select:focus{border-color:#8c8c8c;outline:0}
input::placeholder{color:#595959}
input[type=date]{color-scheme:dark}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px;width:auto;min-height:38px}
.btn:hover{background:var(--cell)}
.btn.p{background:var(--text);border-color:var(--text);color:#000;font-weight:600}
.btn.p:hover{background:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select{width:auto}
.tools .sp{flex:1}
.hint{color:var(--mut);font-size:12px;margin:10px 0 0}

@media(max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"cal" "day" "tools"}
  .wrap>section:nth-of-type(2){position:static}
}
@media(max-width:700px){
  .wrap{padding:10px 8px 40px;gap:10px}
  .panel{padding:14px 12px}
  .grid{gap:3px}
  .cell{min-height:54px;padding:4px;font-size:11px;align-items:center;justify-content:center}
  .cell .d{top:3px;left:5px;font-size:10px}
  .cell .c{display:none}
  .cell.today .d{top:2px;left:3px;padding:0 4px}
  .blank{min-height:54px}
  .dow{font-size:11px;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">

  <section class="panel" aria-label="Calendrier de PnL">
    <div class="head">
      <div class="l">
        <h1>PnL Calendar</h1>
        <div class="pills" id="pills" role="group" aria-label="Filtrer par marché"></div>
      </div>
      <div class="r">
        <div class="nav">
          <button class="ib" id="prev" type="button" aria-label="Mois précédent">‹</button>
          <h2 id="title"></h2>
          <button class="ib" id="next" type="button" aria-label="Mois suivant">›</button>
        </div>
        <button class="ib boxed" id="today" type="button" aria-label="Revenir à aujourd’hui" title="Aujourd’hui">◎</button>
        <button class="ib boxed" id="best" type="button" aria-label="Aller au meilleur jour du mois" title="Meilleur jour">🏆</button>
      </div>
    </div>

    <div class="total" id="total"></div>
    <div class="bar" id="bar"></div>
    <div class="bl"><span class="a" id="bl"></span><span class="b" id="br"></span></div>

    <div class="grid" id="grid"></div>
    <div class="sub" id="sub"></div>
  </section>

  <section class="panel day">
    <h3 id="dayTitle"></h3>
    <ul class="list" id="list"></ul>
    <form id="form" autocomplete="off">
      <label>Date<input type="date" id="fdate" required></label>
      <label>Marché
        <select id="fmarket">
          <option value="memecoin">Memecoins</option>
          <option value="forex">Forex</option>
          <option value="crypto">Crypto</option>
          <option value="actions">Actions</option>
          <option value="autre">Autre</option>
        </select>
      </label>
      <label>Note<input type="text" id="fnote" maxlength="160" placeholder="Setup, erreur, leçon…"></label>
      <label>PnL (ex : -25 ou 140,5)<input type="text" inputmode="decimal" id="fpnl" placeholder="-25" required></label>
      <div class="full w"><button class="btn p" type="submit">Ajouter le trade</button></div>
    </form>
  </section>

  <section class="panel">
    <div class="tools">
      <label for="cur" style="color:var(--mut);font-size:13px">Devise</label>
      <select id="cur"><option>$</option><option>€</option><option>£</option></select>
      <span class="sp"></span>
      <button class="btn" id="exJson" type="button">Exporter JSON</button>
      <button class="btn" id="exCsv" type="button">Exporter CSV</button>
      <button class="btn" id="imJson" type="button">Importer JSON</button>
      <button class="btn" id="demo" type="button">Charger une démo</button>
      <button class="btn" id="wipe" type="button">Tout effacer</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <p class="hint">Tes trades sont enregistrés uniquement dans ce navigateur. Pense à exporter pour sauvegarder.</p>
  </section>
</div>

<script>
(function(){
"use strict";
var KEY="pnl-calendar-v1";
var M={memecoin:"Memecoins",forex:"Forex",crypto:"Crypto",actions:"Actions",autre:"Autre"};
var DOW=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var now=new Date();
var S={trades:[],cur:"$",filter:"all",y:now.getFullYear(),m:now.getMonth(),sel:null};
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function ymd(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ok(t){return t&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||"")&&isFinite(Number(t.pnl))}
function num(n){return Math.abs(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return n===0?"0"+S.cur:(n>0?"+":"-")+S.cur+num(n)}
function cl(n){return n>0?"gn":n<0?"ls":""}

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(Array.isArray(d.trades))S.trades=d.trades.filter(ok);if(["$","€","£"].indexOf(d.currency)>-1)S.cur=d.currency}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({trades:S.trades,currency:S.cur}))}catch(e){}}
function visible(){return S.trades.filter(function(t){return S.filter==="all"||t.market===S.filter})}
function inMonth(t){return t.date.indexOf(S.y+"-"+pad(S.m+1)+"-")===0}

function monthMap(){
  var map={};
  visible().filter(inMonth).forEach(function(t){var o=map[t.date]||(map[t.date]={p:0,c:0});o.p+=Number(t.pnl);o.c++});
  return map;
}

function renderPills(){
  var h='<button type="button" class="pill" data-f="all" aria-pressed="'+(S.filter==="all")+'">Tous</button>';
  Object.keys(M).forEach(function(k){h+='<button type="button" class="pill" data-f="'+k+'" aria-pressed="'+(S.filter===k)+'">'+M[k]+'</button>'});
  $("pills").innerHTML=h;
}

function render(){
  var d1=new Date(S.y,S.m,1);
  var lab=d1.toLocaleDateString("fr-FR",{month:"short",year:"numeric"});
  $("title").textContent=lab.charAt(0).toUpperCase()+lab.slice(1);
  $("cur").value=S.cur;
  renderPills();

  var map=monthMap(),keys=Object.keys(map),tot=0,wc=0,ws=0,lc=0,ls=0,best=null,trades=0,wins=0;
  keys.forEach(function(k){
    var p=map[k].p;tot+=p;trades+=map[k].c;
    if(p>0){wc++;ws+=p;if(best===null||p>map[best].p)best=k}
    else if(p<0){lc++;ls+=-p}
  });
  visible().filter(inMonth).forEach(function(t){if(Number(t.pnl)>0)wins++});

  $("total").innerHTML='PnL total du mois : <span class="'+cl(tot)+'">'+money(tot)+'</span>';
  var mx=0;keys.forEach(function(k){mx=Math.max(mx,Math.abs(map[k].p))});var sum=ws+ls;
  $("bar").innerHTML=sum?'<i class="a" style="width:'+(ws/sum*100)+'%"></i><i class="b" style="width:'+(ls/sum*100)+'%"></i>':'';
  $("bl").textContent=wc+" / "+S.cur+num(ws);
  $("br").textContent=lc+" / "+S.cur+num(ls);

  var off=(d1.getDay()+6)%7,n=new Date(S.y,S.m+1,0).getDate();
  var td=new Date(),today=ymd(td.getFullYear(),td.getMonth(),td.getDate());
  var h=DOW.map(function(x){return'<div class="dow">'+x+'</div>'}).join("");
  var i;
  for(i=0;i<off;i++)h+='<div class="blank"></div>';
  for(var d=1;d<=n;d++){
    var k=ymd(S.y,S.m,d),v=map[k],c="cell",txt="0"+S.cur;
    if(v){
      txt=money(v.p);
      if(v.p>0)c+=(k===best&&wc>1)?" k":" g";
      else if(v.p<0)c+=" l";
    }
    if(k===today)c+=" today";
    if(k===S.sel)c+=" sel";
    h+='<button type="button" class="'+c+'" data-d="'+k+'" aria-label="'+d+' '+lab+' : '+txt+'"'+(v&&mx?' style="--i:'+(Math.abs(v.p)/mx).toFixed(2)+'"':'')+'><span class="d">'+d+'</span>'+txt+(v&&v.c>1?'<span class="c">'+v.c+' trades</span>':'')+'</button>';
  }
  $("grid").innerHTML=h;
  $("sub").textContent=trades?trades+(trades>1?" trades":" trade")+" · "+Math.round(wins/trades*100)+" % de trades gagnants":"Aucun trade ce mois-ci. Clique sur un jour pour en ajouter un.";
  $("best").dataset.d=best||"";
  renderDay();
}

function renderDay(){
  var d=$("fdate").value;
  if(!d){$("dayTitle").textContent="Choisis un jour";$("list").innerHTML="";return}
  $("dayTitle").textContent=new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var L=S.trades.filter(function(t){return t.date===d});
  $("list").innerHTML=L.length?L.map(function(t){
    var p=Number(t.pnl);
    return'<li><span class="t"><b>'+(esc(t.symbol)||esc(t.note)||"Sans nom")+'</b> <span style="color:var(--mut);font-size:13px">'+(M[t.market]||"")+'</span>'+(t.note&&t.symbol?'<span class="n">'+esc(t.note)+'</span>':'')+'</span><span class="v '+cl(p)+'">'+money(p)+'</span><button type="button" class="x" data-x="'+esc(t.id)+'" aria-label="Supprimer ce trade">Supprimer</button></li>';
  }).join(""):'<li><span class="none">Aucun trade ce jour-là. Ajoute-le ci-dessous.</span></li>';
}

function pickDay(k,focus){S.sel=k;$("fdate").value=k;render();if(focus)$("fpnl").focus()}
function dl(name,type,txt){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([txt],{type:type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},500)}
function q(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}

function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(y,m,seed){
  var R=rng(seed),out=[],n=new Date(y,m+1,0).getDate(),me=["BONK","WIF","POPCAT","PEPE"],fx=["EUR/USD","GBP/JPY","XAU/USD"];
  for(var d=1;d<=n;d++){
    var w=new Date(y,m,d).getDay();if(w===0||w===6||R()<0.3)continue;
    for(var i=0,c=1+Math.floor(R()*2);i<c;i++){
      var meme=R()<0.55,win=R()<0.45,mag=meme?10+R()*120:5+R()*60;
      out.push({id:uid(),date:ymd(y,m,d),market:meme?"memecoin":"forex",symbol:meme?me[Math.floor(R()*me.length)]:fx[Math.floor(R()*fx.length)],pnl:Math.round((win?mag:-mag*0.8)*100)/100,note:""});
    }
  }
  return out;
}

$("prev").onclick=function(){S.m--;if(S.m<0){S.m=11;S.y--}render()};
$("next").onclick=function(){S.m++;if(S.m>11){S.m=0;S.y++}render()};
$("today").onclick=function(){var t=new Date();S.y=t.getFullYear();S.m=t.getMonth();pickDay(ymd(S.y,S.m,t.getDate()))};
$("best").onclick=function(){if(this.dataset.d)pickDay(this.dataset.d)};
$("pills").onclick=function(e){var b=e.target.closest("[data-f]");if(!b)return;S.filter=b.getAttribute("data-f");render()};
$("cur").onchange=function(){S.cur=this.value;save();render()};
$("grid").onclick=function(e){var b=e.target.closest("[data-d]");if(b)pickDay(b.getAttribute("data-d"),true)};
$("fdate").onchange=function(){S.sel=this.value;renderDay()};
$("list").onclick=function(e){
  var b=e.target.closest("[data-x]");if(!b)return;
  var id=b.getAttribute("data-x");
  S.trades=S.trades.filter(function(t){return t.id!==id});save();render();
};
$("form").onsubmit=function(e){
  e.preventDefault();
  var p=parseFloat(String($("fpnl").value).replace(/\s/g,"").replace(",","."));
  if(!isFinite(p)){alert("Le PnL doit être un nombre, par exemple -25 ou 140,5.");$("fpnl").focus();return}
  var date=$("fdate").value;if(!date)return;
  S.trades.push({id:uid(),date:date,market:$("fmarket").value,symbol:"",pnl:p,note:$("fnote").value.trim()});
  save();
  var pr=date.split("-");S.y=+pr[0];S.m=+pr[1]-1;S.sel=date;
  $("fpnl").value="";$("fnote").value="";
  render();$("fpnl").focus();
};
$("exJson").onclick=function(){dl("pnl-calendar.json","application/json",JSON.stringify({trades:S.trades,currency:S.cur},null,2))};
$("exCsv").onclick=function(){
  var rows=["date,marche,symbole,pnl,note"].concat(S.trades.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(t){return[t.date,t.market,q(t.symbol),t.pnl,q(t.note)].join(",")}));
  dl("pnl-calendar.csv","text/csv",rows.join("\n"));
};
$("imJson").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{
    var d=JSON.parse(rd.result),a=Array.isArray(d)?d:d.trades;if(!Array.isArray(a))throw 0;
    var add=a.filter(ok).map(function(t){return{id:uid(),date:t.date,market:M[t.market]?t.market:"autre",symbol:String(t.symbol||""),pnl:Number(t.pnl),note:String(t.note||"")}});
    S.trades=S.trades.concat(add);save();render();alert(add.length+" trades importés.");
  }catch(err){alert("Fichier JSON non reconnu.")}};
  rd.readAsText(f);this.value="";
};
$("demo").onclick=function(){
  var p=new Date(S.y,S.m-1,1);
  S.trades=S.trades.concat(demo(p.getFullYear(),p.getMonth(),7),demo(S.y,S.m,11));save();render();
};
$("wipe").onclick=function(){if(S.trades.length&&confirm("Supprimer tous les trades de ce navigateur ? C’est définitif.")){S.trades=[];save();render()}};

load();
var t0=new Date();
S.sel=ymd(t0.getFullYear(),t0.getMonth(),t0.getDate());
$("fdate").value=S.sel;
render();
})();
</script>
</body>
</html>
